<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>HTML Box Model</title>
    <link
      rel="stylesheet"
      href="style.css"
    />
  </head>
  <body>
    <div class="container">
      <div class="card">
        <h1>Card heading</h1>
        <p>Card text</p>
        <!-- This is inline elements. They don't take full space -->
        <img
          src="https://fastly.picsum.photos/id/237/200/300.jpg?hmac=TmmQSbShHz9CdQm0NkEjx1Dyh_Y984R9LpNrpvH2D_U"
          alt="this si dog image"
        />
        <img
          src="https://fastly.picsum.photos/id/237/200/300.jpg?hmac=TmmQSbShHz9CdQm0NkEjx1Dyh_Y984R9LpNrpvH2D_U"
          alt="this si dog image"
        />
      </div>
    </div>
    <!-- These are block level elements. They takes full width by default -->
    <h1 class="heading-1">Card heading</h1>
    <p class="heading-1">Card heading</p>
  </body>
</html>
