<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>CSS Basics</title>
    <link
      rel="stylesheet"
      href="style.css"
    />
    <!-- This is called internal css which is written inside
    style tag. Style tag is written in head tag -->
    <style>
      body {
        background-color: red;
      }
      h1 {
        font-size: 50px;
        color: white;
        font-weight: 900;
      }

      h2 {
        color: white;
      }
    </style>
  </head>
  <body style="background-color: aqua">
    <!-- This is inline css. Inline css is defined inside tag using style attribute -->
    <h1
      style="
        font-size: 50px;
        color: black;
        font-weight: 900;
      "
    >
      This is heading one
    </h1>
    <h2>This is heading two</h2>

    
    <h3>This is heading three</h3>
    <h4>This is heading four</h4>
    <h5>This is heading five</h5>
    <h6>This is heading six</h6>
  </body>
</html>
